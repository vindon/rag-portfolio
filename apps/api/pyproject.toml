[project]
name = "gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "model-gateway",
    "spend-guard",
    "numpy>=1.26,<2.5",  # >=2.5's stubs use PEP 695 syntax mypy can't parse at python_version=3.11
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "anyio==4.15.1",
    "httpx==0.28.1",
    "ruff==0.16.6",
    "black==26.5.1",
    "mypy==2.3.1",
    "asyncpg-stubs==0.31.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.hatch.build.targets.wheel.force-include]
"src/gateway/domains/hr_policy/data/hr_policy.md" = "gateway/domains/hr_policy/data/hr_policy.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
